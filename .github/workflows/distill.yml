name: Monthly Wiki Publication

on:
  pull_request:
    branches: [main]
    paths:
      - 'compiled/monthly/**/*.md'
      - 'src/monthly_draft.py'
      - 'tests/test_monthly_draft.py'
      - '.github/workflows/distill.yml'
  push:
    branches: [main]
    paths:
      - 'compiled/monthly/**/*.md'
  workflow_dispatch:
    inputs:
      period:
        description: '月報期間（YYYY-MM）'
        required: true
        type: string

# Keep serialization with the crawler: both publication paths update generated
# data, and overlapping runs could otherwise publish against different snapshots.
concurrency:
  group: insurance-kb-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test monthly draft validator
        run: python -m pytest tests/test_monthly_draft.py -q

      - name: Validate complete monthly draft set
        env:
          EVENT_NAME: ${{ github.event_name }}
          MONTH_PERIOD: ${{ inputs.period }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -m src.monthly_draft validate --period "$MONTH_PERIOD"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            python -m src.monthly_draft validate-changed --base "$PR_BASE" --head "$PR_HEAD"
          else
            python -m src.monthly_draft validate-changed --base "$PUSH_BASE" --head "$PUSH_HEAD"
          fi

  publish:
    needs: validate-draft
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Revalidate draft against the publication snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MONTH_PERIOD: ${{ inputs.period }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -m src.monthly_draft validate --period "$MONTH_PERIOD"
          else
            python -m src.monthly_draft validate-changed --base "$PUSH_BASE" --head "$PUSH_HEAD"
          fi

      - name: Monthly quality audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003856903916"
          TELEGRAM_TOPIC_ID: "4"
        run: python -m src.monthly_audit

      - name: Build and validate Wiki publication
        env:
          AGENT_INDEX_SYNC_PLAN: /tmp/agent-index-sync.json
        run: |
          python build_wiki_json.py
          python -m src.agent_publication
          python -m src.publication_check

      - name: Verify published monthly Wiki pages
        env:
          EVENT_NAME: ${{ github.event_name }}
          MONTH_PERIOD: ${{ inputs.period }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -m src.monthly_draft verify-published --period "$MONTH_PERIOD"
          else
            python -m src.monthly_draft verify-changed --base "$PUSH_BASE" --head "$PUSH_HEAD"
          fi

      - name: Commit and push publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compiled/ frontend/public/data/
          python -m src.publication_check --staged
          if git diff --staged --quiet; then
            echo "No publication artifacts changed"
            exit 0
          fi
          git commit -m "chore: publish monthly Wiki $(date +%Y-%m)"
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "ERROR: publication rebase conflict; concurrent crawl detected." >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Deploy updated publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd frontend
          npm install
          npx vite build
          npx wrangler pages deploy dist --project-name insurance-kb-v2 --branch main --commit-dirty=true

      - name: Verify published snapshot
        run: python -m src.publication_check --live

      - name: Synchronize Agent D1 search index
        env:
          AGENT_INDEX_SYNC_PLAN: /tmp/agent-index-sync.json
          AGENT_INDEX_SYNC_TOKEN: ${{ secrets.AGENT_INDEX_SYNC_TOKEN }}
        run: python -m src.agent_search_sync

      - name: Preserve failed Agent sync plan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-sync-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/agent-index-sync.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003856903916"
          TELEGRAM_TOPIC_ID: "4"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRIOR=$(gh api "repos/${{ github.repository }}/actions/workflows/distill.yml/runs?status=completed&per_page=30" \
                    --jq '[.workflow_runs[].conclusion] | index("success") // 30' 2>/dev/null || echo 0)
          STREAK=$((PRIOR + 1))
          HEAD="Insurance KB 月 Wiki 發布失敗"
          [ "$STREAK" -ge 2 ] && HEAD="Insurance KB 月 Wiki 連續第 ${STREAK} 次失敗"
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                     --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "unknown")
          MSG="【${HEAD}】
          失敗步驟: ${FAILED}
          Run: ${{ github.run_id }} (${{ github.event_name }})
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl --fail-with-body --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="${MSG}" | jq -e '.ok == true' > /dev/null
