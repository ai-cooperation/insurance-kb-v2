name: Release Insurance KB

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Also deploy Worker (requires a Worker-capable CI token; current token is Pages-only)'
        type: boolean
        default: false
      agent_sync_plan:
        description: 'Optional checked-in Agent D1 sync plan JSON path'
        type: string
        required: false
        default: ''

# Deploy only the reviewed main snapshot. No crawl, LLM calls, DB migrations,
# or changes to secrets. Share the existing lock so data cannot race a release.
concurrency:
  group: insurance-kb-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          npm install --prefix frontend --no-audit --no-fund
          npm install --prefix workers --no-audit --no-fund
      - name: Verify publication
        run: |
          python -m pytest tests -q
          python -m src.publication_check
          npm run typecheck --prefix workers
          cd workers
          AGENT_PUBLICATION_DIR=../frontend/public/data/agent npm test
      - name: Verify deployment targets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes --package wrangler@4.130.0 wrangler pages project list --json > /tmp/insurance-pages-projects.json
          python -c 'import json; p=json.load(open("/tmp/insurance-pages-projects.json")); assert any(x.get("Project Name")=="insurance-kb-v2" for x in p), "Expected Pages project missing; refusing deployment"'
          npx --yes --package wrangler@4.130.0 wrangler pages deployment list --project-name insurance-kb-v2 --environment production
      - name: Verify Worker deployment target
        if: inputs.deploy_worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes --package wrangler@4.130.0 wrangler deployments list
          npx --yes --package wrangler@4.130.0 wrangler deploy --dry-run --keep-vars
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Browser QA before publication
        working-directory: frontend
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node release-browser-qa.mjs
      - name: Apply Worker D1 migrations
        if: inputs.deploy_worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package wrangler@4.130.0 wrangler d1 migrations apply insurance-kb-reports --remote
      - name: Deploy Worker
        if: inputs.deploy_worker
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package wrangler@4.130.0 wrangler deploy --keep-vars
      - name: Verify live Worker
        if: inputs.deploy_worker
        run: |
          python -c 'import requests; r=requests.get("https://insurance-kb-api.alan-chen75.workers.dev/mcp/manifest",timeout=30); r.raise_for_status(); m=r.json(); assert m["version"]=="0.5.1"; assert {"get_article","list_knowledge"}.issubset({t["name"] for t in m["tools"]}); s=next(t for t in m["tools"] if t["name"]=="search_articles"); assert "cursor" not in s["inputSchema"]["properties"] and s["inputSchema"]["properties"]["limit"]["maximum"]==20; print("Live MCP 0.5.1 compact complete-search contract verified")'
      - name: Deploy Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package wrangler@4.130.0 wrangler pages deploy dist --project-name insurance-kb-v2 --branch main --commit-dirty=true
      - name: Verify published data
        run: python -m src.publication_check --live
      - name: Synchronize Agent D1 search index
        if: inputs.agent_sync_plan != ''
        env:
          AGENT_INDEX_SYNC_PLAN: ${{ inputs.agent_sync_plan }}
          AGENT_INDEX_SYNC_TOKEN: ${{ secrets.AGENT_INDEX_SYNC_TOKEN }}
        run: |
          python -c 'import os; from pathlib import Path; p=Path(os.environ["AGENT_INDEX_SYNC_PLAN"]).resolve(); assert p.is_file() and p.is_relative_to((Path.cwd() / "repairs").resolve()), "Sync plan must be inside repairs/"'
          python -m src.agent_search_sync
      - name: Retain failed Agent sync plan
        if: failure() && inputs.agent_sync_plan != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-sync-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: repairs/agent-index-sync-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify live website
        run: |
          cd frontend
          node release-browser-qa.mjs https://insurance-kb.cooperation.tw
          node release-browser-qa.mjs https://insurance-kb-v2.pages.dev
      - name: Retain browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insurance-release-browser-qa
          path: frontend/release-qa/
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="-1003856903916" -d message_thread_id="4" \
            --data-urlencode text="Insurance KB 發布失敗：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
