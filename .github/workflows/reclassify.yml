name: Reclassify Articles (LLM)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to reclassify (0=all)'
        required: false
        default: '0'
        type: string
      dry_run:
        description: 'Dry run (no save)'
        required: false
        default: false
        type: boolean
      korean_only:
        description: 'Only re-translate KR-source articles still in Hangul (488 backlog from 04-19~23)'
        required: false
        default: false
        type: boolean
      untranslated_since:
        description: 'Backfill: re-translate untranslated/summary-less articles dated >= YYYY-MM-DD (GitHub Models retirement outage)'
        required: false
        default: ''
        type: string

# Share the pipeline lock with crawl.yml + distill.yml. Reclassify is a
# heavy job that mutates master-index.json across thousands of entries
# (up to 120 min); any crawl that pushes during the same window would
# guarantee a rebase conflict. Lock prevents the race outright.
concurrency:
  group: insurance-kb-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reclassify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODELS_PAT: ${{ secrets.MODELS_PAT }}
        run: |
          ARGS="--batch-size 10 --delay 3"
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.korean_only }}" = "true" ]; then
            ARGS="$ARGS --korean-only"
          fi
          if [ -n "${{ inputs.untranslated_since }}" ]; then
            ARGS="$ARGS --untranslated-since ${{ inputs.untranslated_since }}"
          fi
          python reclassify.py $ARGS

      - name: Rebuild frontend data
        run: |
          # Use the proper builder so L2 dedup, KR normalization, and slim
          # field selection are applied. (Previously this step did a raw cp
          # of master-index.json over articles.json — wrong shape and missed
          # the post-processing layers.)
          python build_frontend_data.py
          python build_wiki_json.py

      - name: Commit changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index/master-index.json frontend/public/data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: reclassify articles via LLM"
          # Same rebase-or-fail-loud pattern as crawl.yml / distill.yml.
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "ERROR: rebase conflict on master-index.json — concurrent crawl detected." >&2
            exit 1
          fi
          git push origin HEAD:main
