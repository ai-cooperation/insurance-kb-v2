name: Insurance KB Crawl

on:
  # The deployed insurance-kb-cron Worker is the single scheduler. Keeping a
  # GitHub cron here as well ran the same pipeline four times/day and doubled
  # translation quota use. Manual and Worker dispatches both use this entry.
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Inclusive backfill start date (YYYY-MM-DD)"
        required: false
        type: string
      backfill_to:
        description: "Inclusive backfill end date (YYYY-MM-DD)"
        required: false
        type: string
      lookback_days:
        description: "Temporary Google News lookback (1-90 days)"
        required: false
        default: "14"
        type: string

# Prevent concurrent crawls. If a scheduled run is in flight, a manual
# workflow_dispatch (or vice versa) queues behind it instead of racing.
# cancel-in-progress: false because mid-crawl work shouldn't be thrown
# away just because a new trigger arrived — let it finish, then queue.
#
# Without this guard, two concurrent runs both mutate master-index.json,
# the second push hits a rebase conflict on the JSON array, rebase aborts,
# HEAD enters detached state, push fails with "not currently on a branch"
# (2026-06-04 backfill + scheduled cron collision, run 26921940617).
concurrency:
  # Shared lock with distill.yml + reclassify.yml — all three mutate
  # index/master-index.json and/or compiled/ via git push. Without this
  # any two concurrent runs hit a rebase conflict on the same array and
  # the second one fails into detached HEAD.
  group: insurance-kb-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawl pipeline
        env:
          # Translation cascade: Groq primary, Gemini fallback quota pool.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Phase 3 failure-rate + Phase 4.5 name-consistency alerts
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003856903916"
          TELEGRAM_TOPIC_ID: "4"
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          BACKFILL_TO: ${{ inputs.backfill_to }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$BACKFILL_FROM" ] || [ -n "$BACKFILL_TO" ]; then
            args+=(--from-date "$BACKFILL_FROM" --to-date "$BACKFILL_TO")
            if [ -n "$LOOKBACK_DAYS" ]; then
              args+=(--lookback-days "$LOOKBACK_DAYS")
            fi
          fi
          python run.py "${args[@]}"

      - name: Build frontend data
        env:
          AGENT_INDEX_SYNC_PLAN: /tmp/agent-index-sync.json
        run: |
          python build_frontend_data.py
          python build_wiki_json.py
          python -m src.agent_publication
          python -m src.publication_check

      - name: Source health check
        # Per-source freshness alarm (state transitions -> Telegram).
        # Never blocks the crawl; state file is committed by the next step.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003856903916"
          TELEGRAM_TOPIC_ID: "4"
        run: python -m src.source_health || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # index/ is ignored: force-add every new immutable shard and snapshot.
          git add -f index/master-index.json index/objects/ index/snapshots/
          python -m src.publication_check --staged
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily crawl $(date -u +%Y-%m-%d_%H:%M)"
          # Rebase to absorb any non-conflicting concurrent commits (e.g.
          # someone pushed a docs change while we crawled). If rebase hits
          # a CONTENT conflict on master-index.json, that means another
          # crawl committed articles we don't know about — abort cleanly
          # (don't enter detached HEAD!) and fail loudly. The concurrency
          # lock above should prevent this case; if we're here, something
          # bypassed the lock and the next scheduled crawl will pick up
          # missing articles via its own GNews query (~10-12h cycle is
          # well within the GNews retention window).
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "ERROR: rebase conflict on master-index.json — concurrent crawl detected." >&2
            echo "Aborted to avoid data loss. Missing articles will be picked up by next scheduled crawl." >&2
            exit 1
          fi
          git push origin HEAD:main

      - name: Deploy to Cloudflare Pages
        run: |
          cd frontend
          npm install
          npx vite build
          npx wrangler pages deploy dist --project-name insurance-kb-v2 --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify published snapshot
        run: python -m src.publication_check --live

      - name: Synchronize Agent D1 search index
        env:
          AGENT_INDEX_SYNC_PLAN: /tmp/agent-index-sync.json
          AGENT_INDEX_SYNC_TOKEN: ${{ secrets.AGENT_INDEX_SYNC_TOKEN }}
        run: python -m src.agent_search_sync

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003856903916"
          TELEGRAM_TOPIC_ID: "4"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Consecutive-failure count: 8 identical alerts looked exactly like
          # the first one, so a 2-day outage read as routine noise (2026-08-05
          # incident — the site served stale data for two days while every
          # alert fired correctly and nobody escalated). Count completed runs
          # before the most recent success so the Nth alert SAYS it is the Nth.
          PRIOR=$(gh api "repos/${{ github.repository }}/actions/workflows/crawl.yml/runs?status=completed&per_page=30" \
                    --jq '[.workflow_runs[].conclusion] | index("success") // 30' 2>/dev/null || echo 0)
          STREAK=$((PRIOR + 1))
          HEAD="Insurance KB crawl 失敗"
          if [ "$STREAK" -ge 3 ]; then
            HEAD="Insurance KB crawl 連續第 ${STREAK} 次失敗 — 資料已停更，需人工處理"
          elif [ "$STREAK" -eq 2 ]; then
            HEAD="Insurance KB crawl 連續第 2 次失敗"
          fi
          # Which step actually failed — the outage was in the deploy step
          # while crawling itself stayed green, and the old alert never said so.
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                     --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "unknown")
          MSG="【${HEAD}】
          失敗步驟: ${FAILED}
          Run: ${{ github.run_id }} (${{ github.event_name }})
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC_ID}" \
            --data-urlencode text="${MSG}" > /dev/null
